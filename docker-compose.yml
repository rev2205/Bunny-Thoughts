version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: bunny_thoughts_db
    environment:
      POSTGRES_USER: bunny
      POSTGRES_PASSWORD: bunnypass
      POSTGRES_DB: bunny_thoughts
    ports:
      - "5432:5432"
    volumes:
      - bunny_postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bunny -d bunny_thoughts"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  bunny_postgres_data:
    driver: local
